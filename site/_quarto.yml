project:
  type: website
  output-dir: _site
  post-render:
    - python ../scripts/site/post-render.py
  render:
    - maxima/examples.qmd
    - maxima/native.qmd
    - maxima/data-flow.qmd
    - maxima/startup.qmd
    - licenses.qmd
  resources:
    - _headers
    - backend/**
    - runtime/**
    - native/**
    - jsxgraph/**
    - maxima-runtime/**
    - stack-sources.json
    - runtime-assets.json
    - MATERIALIZATION.json
    - ctm-isolation.js
    - ctm-isolation-worker.js
    - maxima/questions/**
    - maxima/native-questions/**
    - LICENSES/**

website:
  title: "STACK Maxima"
  navbar:
    left:
      - href: maxima/examples.qmd
        text: Worked questions
      - href: maxima/native.qmd
        text: Native questions
      - href: maxima/data-flow.qmd
        text: Data flow
      - href: maxima/startup.qmd
        text: Start-up timing
    right:
      - href: licenses.qmd
        text: Licences and sources
      - icon: github
        href: https://github.com/Erasmus-CTM/stack-wasm-maxima
        aria-label: Source repository

format:
  html:
    theme: [cosmo, native/parent-assets.scss]
    toc: true
    html-math-method: mathjax
    code-copy: true

filters:
  - stack-maxima
  - stack-sympy

ai-feedback:
  policy-files: feedback/course.yml
  project-policy:
    math-exercise: course-mathematics
