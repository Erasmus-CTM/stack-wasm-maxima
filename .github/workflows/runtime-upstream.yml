# SPDX-License-Identifier: AGPL-3.0-or-later
name: Report pinned runtime upstream drift
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python runtime/build/check-upstream.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-upstream-${{ github.run_id }}
          path: test-results/runtime-upstream/
          if-no-files-found: error
