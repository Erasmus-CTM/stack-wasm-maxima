name: Measure deployed comparison timings

on:
  push:
    branches: ['research/**']
    paths:
      - 'scripts/measure-site-timings.mjs'
      - 'scripts/measure-native-page-timings.mjs'
      - '.github/workflows/page-timings.yml'
  workflow_dispatch:
    inputs:
      page_url:
        description: Deployed comparison page to measure (empty skips the hybrid comparison page)
        required: false
        default: ''
      expected_html_sha256:
        description: SHA-256 of that deployed HTML build ('live' pins what is served when the run starts)
        required: false
        default: 'live'
      native_page_url:
        description: Deployed native question page to measure
        required: true
        default: 'https://erasmus-ctm.github.io/stack-wasm-maxima/maxima/native.html'
      expected_native_html_sha256:
        description: SHA-256 of that deployed native HTML build ('live' pins what is served when the run starts)
        required: true
        default: 'live'

permissions:
  contents: read

concurrency:
  group: page-timings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install the pinned browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
      # 'live' pins the HTML served now; the scripts still refuse a page that
      # changes during measurement. The runtime the page serves is recorded too.
      - name: Pin the deployed pages and record their runtime
        id: pin
        env:
          PAGE_URL: ${{ inputs.page_url }}
          PAGE_SHA: ${{ inputs.expected_html_sha256 }}
          NATIVE_URL: ${{ inputs.native_page_url || 'https://erasmus-ctm.github.io/stack-wasm-maxima/maxima/native.html' }}
          NATIVE_SHA: ${{ inputs.expected_native_html_sha256 || 'live' }}
        run: |
          set -euo pipefail
          pin() { if [[ "$2" == live ]]; then curl -fsSL "$1" | sha256sum | cut -d' ' -f1; else echo "$2"; fi; }
          echo "native_sha=$(pin "$NATIVE_URL" "$NATIVE_SHA")" >> "$GITHUB_OUTPUT"
          if [[ -n "$PAGE_URL" ]]; then echo "page_sha=$(pin "$PAGE_URL" "${PAGE_SHA:-live}")" >> "$GITHUB_OUTPUT"; fi
          mkdir -p test-results/native-page-timings
          curl -fsSL "${NATIVE_URL%maxima/native.html}stack-sources.json" | python3 -c '
          import json, sys
          build = json.load(sys.stdin).get("runtimeBuild") or {}
          print(json.dumps({"release": build.get("release"), "compilerProfile": (build.get("compilerProfile") or {}).get("name"),
                            "manifestSha256": build.get("manifestSha256"), "kind": build.get("kind")}, indent=2))' \
            | tee test-results/native-page-timings/served-runtime.json
      - name: Measure first validation and repeated calls on the public page
        if: ${{ inputs.page_url != '' }}
        env:
          TIMING_PAGE_URL: ${{ inputs.page_url }}
          EXPECTED_HTML_SHA256: ${{ steps.pin.outputs.page_sha }}
        run: node scripts/measure-site-timings.mjs
      - name: Measure native startup and the first optional PythonChecker grade
        env:
          DEBUG: pw:browser
          TIMING_PAGE_URL: ${{ inputs.native_page_url || 'https://erasmus-ctm.github.io/stack-wasm-maxima/maxima/native.html' }}
          EXPECTED_HTML_SHA256: ${{ steps.pin.outputs.native_sha }}
        run: node scripts/measure-native-page-timings.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: page-timings-${{ github.sha }}
          path: |
            test-results/page-timings/
            test-results/native-page-timings/
          if-no-files-found: error
      - name: Report the native page medians
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const s=JSON.parse(require("fs").readFileSync("test-results/native-page-timings/summary.json","utf8"));
            console.log(JSON.stringify({passed:s.passed,statistics:s.statistics,failure:s.failure},null,2));' | tee -a "$GITHUB_STEP_SUMMARY"

