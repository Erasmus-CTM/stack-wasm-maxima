# SPDX-License-Identifier: AGPL-3.0-or-later
name: Diagnose full native noun dispatch (never merge)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/noun-dispatch-diagnostic.yml'
      - 'runtime/diagnostics/noun-dispatch.py'
permissions:
  contents: read
concurrency:
  group: noun-dispatch-diagnostic-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact source commits and verify archive hashes
        run: python runtime/build/prepare-sources.py
      - name: Install the native fixture prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib g++-multilib libc6-dev-i386 autoconf automake libtool libltdl-dev texinfo bison flex gettext gawk pkg-config
      - uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .cache/precompiled-stack/upstream-stack
          sparse-checkout: stack/maxima
          persist-credentials: false
      - name: Build the unchanged native candidate and require its fixture controls
        run: bash runtime/precompiled/native-fixtures.sh
      - name: Translate the complete candidate entry with the unchanged production driver
        run: bash runtime/precompiled/translate-and-cross-compile.sh --native-only "$PWD/.cache/precompiled-stack/upstream-stack"
      - name: Observe fresh full-startup source and translated noun dispatch
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python runtime/diagnostics/noun-dispatch.py
      - name: Retain diagnostic evidence, including failed and unequal observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noun-dispatch-native-${{ github.sha }}
          include-hidden-files: true
          path: |
            .cache/noun-dispatch/
            .cache/precompiled-fixtures/
            .cache/precompiled-stack/logs/
            .cache/precompiled-stack/source/
            .cache/precompiled-stack/source-adapted/
            .cache/precompiled-stack/source-initialized/
            .cache/precompiled-stack/*.lisp
            .cache/runtime-build/source-progress.json
            .cache/runtime-build/logs/source-state-*.json
          if-no-files-found: warn
