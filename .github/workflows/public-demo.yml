name: Public interactive Quarto demo

on:
  push:
    branches: ['research/**']
    paths:
      - '.github/workflows/public-demo.yml'
      - 'scripts/public-demo/**'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Public HTTPS site containing the landing and actual matched exercise pages'
        required: true
        default: 'https://stack-maxima-quarto-comparison.citrus-char-2084.chatgpt.site/'

permissions:
  contents: read

concurrency:
  group: public-stack-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install the pinned browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check the public verifier syntax
        run: node --check scripts/public-demo/verify.mjs
      - name: Verify the actual public landing and exercise controls
        env:
          BASE_URL: ${{ inputs.base_url || 'https://stack-maxima-quarto-comparison.citrus-char-2084.chatgpt.site/' }}
        run: |
          mkdir -p test-results/public-demo
          node scripts/public-demo/verify.mjs 2>&1 | tee test-results/public-demo/run.log
      - name: Upload public-site evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-demo-${{ github.run_id }}-${{ github.sha }}
          path: test-results/public-demo/
          if-no-files-found: warn
