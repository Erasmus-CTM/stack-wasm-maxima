# SPDX-License-Identifier: AGPL-3.0-or-later
name: Research deployed runtime call entry
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'prototype/runtime-callentry/**'
      - '.github/workflows/runtime-callentry.yml'
permissions:
  contents: read
jobs:
  callentry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .callentry-sources/stack
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: c366f175aba6b62caa628bc60f57bb1167fc087b
          path: .callentry-sources/ctm-checkers
          persist-credentials: false
      - name: Install pinned browser and authoring dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
      - name: Stage the unchanged deployed runtime and native question plans
        run: |
          python scripts/milestone-two/prepare-runtime.py --output .cache/callentry \
            --stack-source .callentry-sources/stack --ctm-checkers-source .callentry-sources/ctm-checkers
          python scripts/milestone-three/stage-parser.py --stack-source .callentry-sources/stack --output .cache/callentry/native
          python scripts/milestone-three/compile.py --stack-source .callentry-sources/stack \
            --ctm-checkers-source .callentry-sources/ctm-checkers --output .cache/callentry/native/questions.json \
            --resources .cache/callentry/native-questions
      - name: Compare isolated stdin with nonisolated direct calls
        run: node prototype/runtime-callentry/run.mjs .cache/callentry test-results/runtime-callentry
      - name: Preserve successful and failed observations
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-callentry-${{ github.sha }}
          path: test-results/runtime-callentry/
          if-no-files-found: warn
