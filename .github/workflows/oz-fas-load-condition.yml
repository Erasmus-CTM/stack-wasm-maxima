name: Diagnose twelve cold old Oz FAS root-load conditions
'on':
  push:
    branches: [profiling/e8ad-oz-fas-load-condition]
    paths:
      - .github/workflows/oz-fas-load-condition.yml
      - runtime/profiling/oz-fas-load-condition/**
permissions:
  contents: read
  actions: read
concurrency:
  group: oz-fas-load-condition-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
jobs:
  diagnose:
    if: github.repository == 'Erasmus-CTM/stack-wasm-maxima' && github.event_name == 'push' && github.ref == 'refs/heads/profiling/e8ad-oz-fas-load-condition'
    runs-on: ubuntu-24.04
    # Twelve cases x300s plus complete package admission/setup/evidence upload.
    timeout-minutes: 120
    steps:
      - name: Check out the exact original runtime recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e8ad3d5b8b2ef2327537cd8e7ee50aaf0a8f8d31
          path: trusted
          persist-credentials: false
      - name: Check out this separately reviewed diagnostic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Admit exact original runtime and matching FAS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python diagnostic/runtime/profiling/oz-fas-load-condition/prepare.py \
            --trusted-root "$PWD/trusted" --benchmark-root "$PWD/diagnostic" \
            --work-root "$PWD/.cache/oz-fas-load-condition"
      - name: Install the pinned diagnostic browser driver
        run: |
          npm ci --prefix trusted --ignore-scripts --no-audit --no-fund
          trusted/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p .cache/oz-fas-load-condition/tools
          for diagnostic_tool in run.mjs clean-probe-worker.js derive-startup-observer.mjs startup-observer.jsfrag condition-stage.mjs load-condition.lisp; do
            cp "diagnostic/runtime/profiling/oz-fas-load-condition/$diagnostic_tool" .cache/oz-fas-load-condition/tools/
          done
          ln -s "$PWD/trusted/node_modules" .cache/oz-fas-load-condition/tools/node_modules
          node --version > .cache/oz-fas-load-condition/evidence/node-version.txt
          trusted/node_modules/.bin/playwright --version > .cache/oz-fas-load-condition/evidence/playwright-version.txt
      - name: Record hardware outside diagnostic cases
        run: |
          node --input-type=module <<'JS'
          import os from 'node:os';
          import {writeFileSync} from 'node:fs';
          const cpus=os.cpus();
          writeFileSync('.cache/oz-fas-load-condition/evidence/runner-hardware.json',JSON.stringify({
            schema:1,observedBeforeMeasurement:true,platform:os.platform(),release:os.release(),arch:os.arch(),
            logicalCPUCount:cpus.length,cpuModels:[...new Set(cpus.map(cpu=>cpu.model))],
            availableParallelism:os.availableParallelism(),totalMemoryBytes:os.totalmem(),
            scope:'Untimed host metadata only; no CPU sampler, causal attribution or cross-run timing normalization.'
          },null,2)+'\n');
          JS
      - name: Run the twelve bounded cold FAS diagnostic cases
        timeout-minutes: 70
        run: |
          set -o pipefail
          node .cache/oz-fas-load-condition/tools/run.mjs \
            --trusted-root "$PWD/trusted" --profiles-root "$PWD/.cache/oz-fas-load-condition/profiles" \
            --admission "$PWD/.cache/oz-fas-load-condition/evidence/admission.json" \
            --output "$PWD/.cache/oz-fas-load-condition/evidence" --trials 12 \
            2>&1 | tee .cache/oz-fas-load-condition/evidence/run.log
      - name: Retain all completed and partial diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oz-fas-load-condition-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: .cache/oz-fas-load-condition/evidence/
