# SPDX-License-Identifier: AGPL-3.0-or-later
name: Experiment with precompiled STACK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/precompiled/**'
      - 'prototype/runtime/maxima-child.js'
      - '.github/workflows/precompiled-stack.yml'
permissions:
  contents: read
concurrency:
  group: precompiled-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bundle-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact owned-runtime inputs
        run: |
          node runtime/build/test-runtime-source.mjs
          python runtime/build/test-substitution.py
          python runtime/build/test-toolchain.py
          python runtime/build/test-cold-evidence.py
          python runtime/build/test-source-checkout.py
      - name: Fetch exact source commits and verify archive hashes
        run: python runtime/build/prepare-sources.py
      - name: Install native and 32-bit build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib g++-multilib \
            libc6-dev-i386 autoconf automake libtool libltdl-dev texinfo bison flex gettext gawk pkg-config
      - name: Build the pinned unoptimized Maxima/ECL control
        run: bash runtime/build/build.sh
      - uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .cache/precompiled-stack/upstream-stack
          sparse-checkout: stack/maxima
          persist-credentials: false
      - name: Translate pinned STACK and cross-compile for the browser target
        run: bash runtime/precompiled/translate-and-cross-compile.sh "$PWD/.cache/precompiled-stack/upstream-stack"
      - uses: actions/checkout@v4
        with:
          ref: b34bfc8af10cd80b6130baabe88a47c9a32c0333
          path: .cache/runtime-build/notices
          persist-credentials: false
      - name: Package the exact source-loaded runtime control
        run: python runtime/build/package.py --notices .cache/runtime-build/notices
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: c366f175aba6b62caa628bc60f57bb1167fc087b
          path: .cache/precompiled-stack/ctm-checkers
          persist-credentials: false
      - name: Install pinned native packaging dependencies
        run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
      - name: Stage the unchanged source-loaded control and opt-in compiled manifest
        run: |
          python scripts/milestone-two/prepare-runtime.py --output .cache/precompiled-stack/site \
            --runtime-source .cache/runtime-build/artifact \
            --stack-source .cache/precompiled-stack/upstream-stack \
            --ctm-checkers-source .cache/precompiled-stack/ctm-checkers
          python runtime/precompiled/stage-variant.py --site .cache/precompiled-stack/site \
            --stack-source .cache/precompiled-stack/upstream-stack \
            --bundle .cache/precompiled-stack/stackmaxima.fas \
            --translated .cache/precompiled-stack/source/stackmaxima.lisp
      - name: Install pinned browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Measure actual source and precompiled browser startup
        env:
          PRECOMPILED_SITE: .cache/precompiled-stack/site
        run: node runtime/precompiled/measure.mjs
      - name: Preserve the feasibility evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precompiled-stack-probe-${{ github.sha }}
          include-hidden-files: true
          path: |
            .cache/precompiled-stack/logs/
            .cache/precompiled-stack/source/stackmaxima.mac
            .cache/precompiled-stack/source/stackmaxima.LISP
            .cache/precompiled-stack/source/stackmaxima.lisp
            .cache/precompiled-stack/source/stackmaxima.UNLISP
            .cache/precompiled-stack/source/stackmaxima.unlisp
            .cache/precompiled-stack/source/ctm-assignment-probe.mac
            .cache/precompiled-stack/source/ctm-assignment-probe.LISP
            .cache/precompiled-stack/source/ctm-assignment-probe.UNLISP
            .cache/precompiled-stack/source/ctm-stackmaxima.asd
            .cache/precompiled-stack/translate-driver.lisp
            .cache/precompiled-stack/assignment-probe-driver.lisp
            .cache/precompiled-stack/stackmaxima.fas
            .cache/precompiled-stack/site/stack-sources.json
            .cache/precompiled-stack/site/stack-sources-timed-source.json
            .cache/precompiled-stack/site/stack-sources-precompiled.json
            .cache/precompiled-stack/site/maxima-runtime/stackmaxima.fas
            .cache/runtime-build/artifact/manifest.json
            test-results/precompiled-stack/
            .cache/runtime-build/logs/
            .cache/runtime-build/source-progress.json
          if-no-files-found: warn
