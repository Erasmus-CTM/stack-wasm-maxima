name: Diagnose native translation and reset fixtures
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/precompiled/**'
      - 'runtime/build/**'
      - 'runtime/diagnostics/gc-root-regression.*'
      - '.github/workflows/precompiled-fixtures.yml'
      - '.github/workflows/runtime-release.yml'
permissions:
  contents: read
concurrency:
  group: native-precompiled-fixtures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check bundle provenance and controller report bindings
        run: |
          python runtime/precompiled/test-bundle-provenance.py
          python runtime/precompiled/test-controller-parity.py
          python runtime/build/test-source-overlay.py
      - name: Fetch exact source commits and verify archive hashes
        run: python runtime/build/prepare-sources.py
      - name: Install native and 32-bit build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib g++-multilib libc6-dev-i386 autoconf automake libtool libltdl-dev texinfo bison flex gettext gawk pkg-config
      - name: Require pinned collector root regression at both native pointer widths
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          task_failed=0
          for task_bits in 32 64; do
            python runtime/diagnostics/gc-root-regression.py \
              --source .cache/runtime-build/sources/ecl/src/bdwgc \
              --output ".cache/gc-root-regression/$task_bits" --bits "$task_bits" || task_failed=1
          done
          exit "$task_failed"
      - uses: actions/checkout@v7
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .cache/precompiled-stack/upstream-stack
          sparse-checkout: stack/maxima
          persist-credentials: false
      - name: Build native-only prerequisites and compare unchanged controls with fixture adapters
        run: bash runtime/precompiled/native-fixtures.sh
      - name: Require complete native entry translation with the same controls as the browser probe
        run: bash runtime/precompiled/translate-and-cross-compile.sh --native-only "$PWD/.cache/precompiled-stack/upstream-stack"
      - uses: actions/checkout@v7
        with:
          repository: maths/moodle-qtype_stack
          ref: 10d323311b7f39fb7b092dd10ce75f7d8632f525
          path: .cache/precompiled-stack-10d3233/upstream-stack
          sparse-checkout: stack/maxima
          persist-credentials: false
      - name: Require complete native entry translation at the older pin
        env:
          CTM_PRECOMPILED_STACK_PIN: 10d323311b7f39fb7b092dd10ce75f7d8632f525
        run: bash runtime/precompiled/translate-and-cross-compile.sh --native-only "$PWD/.cache/precompiled-stack-10d3233/upstream-stack"
      - name: Require fresh full-library native validation parity at both pins
        run: |
          python runtime/precompiled/full-entry-check.py --pin 33383047af39c204bf4442802a058f8b918b2b1b
          python runtime/precompiled/full-entry-check.py --pin 10d323311b7f39fb7b092dd10ce75f7d8632f525
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: precompiled-native-fixtures-${{ github.sha }}
          include-hidden-files: true
          path: |
            .cache/gc-root-regression/*/report.json
            .cache/gc-root-regression/*/*.stdout
            .cache/gc-root-regression/*/*.stderr
            .cache/gc-root-regression/*/build/gc-root-regression
            .cache/gc-root-regression/*/build/.libs/libgc.a
            .cache/gc-root-regression/*/build/include/config.h
            .cache/precompiled-fixtures/
            .cache/precompiled-stack/logs/
            .cache/precompiled-stack/source/
            .cache/precompiled-stack/source-adapted/
            .cache/precompiled-stack/source-initialized/
            .cache/precompiled-stack/*.lisp
            .cache/precompiled-stack-10d3233/logs/
            .cache/precompiled-stack-10d3233/source/
            .cache/precompiled-stack-10d3233/source-adapted/
            .cache/precompiled-stack-10d3233/source-initialized/
            .cache/precompiled-stack-10d3233/*.lisp
            .cache/runtime-build/source-progress.json
            .cache/runtime-build/logs/source-state-*.json
          if-no-files-found: warn
