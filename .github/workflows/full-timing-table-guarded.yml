name: Compare all six guarded Maxima and STACK timing cells
'on':
  push:
    branches: [timing/e8ad-six-cell-guarded]
    paths:
      - .github/workflows/full-timing-table-guarded.yml
      - runtime/timing/full-table-guarded/**
permissions:
  contents: read
  actions: read
concurrency:
  group: six-cell-guarded-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
jobs:
  compare:
    if: github.repository == 'Erasmus-CTM/stack-wasm-maxima' && github.event_name == 'push' && github.ref == 'refs/heads/timing/e8ad-six-cell-guarded'
    runs-on: ubuntu-24.04
    # 36 measurements x300s worst-case =180min, plus admission/setup/upload.
    timeout-minutes: 240
    steps:
      - name: Check out the accepted old producer recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e8ad3d5b8b2ef2327537cd8e7ee50aaf0a8f8d31
          path: old-trusted
          persist-credentials: false
      - name: Check out the exact candidate producer recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 58cf269f303898a7b679d9d164346fbb9384b781
          path: candidate-trusted
          persist-credentials: false
      - name: Check out this independently reviewed benchmark
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: benchmark
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Admit exact original packages and matching FAS inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmark/runtime/timing/full-table-guarded/prepare.py \
            --old-trusted-root "$PWD/old-trusted" --candidate-trusted-root "$PWD/candidate-trusted" \
            --benchmark-root "$PWD/benchmark" --work-root "$PWD/.cache/full-timing-table-guarded"
      - name: Install the pinned guarded Chromium harness
        run: |
          cmp old-trusted/package-lock.json candidate-trusted/package-lock.json
          npm ci --prefix old-trusted --ignore-scripts --no-audit --no-fund
          old-trusted/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p .cache/full-timing-table-guarded/tools
          for timing_tool in run.mjs clean-probe-worker.js derive-startup-observer.mjs startup-observer.jsfrag; do
            cp "benchmark/runtime/timing/full-table-guarded/$timing_tool" .cache/full-timing-table-guarded/tools/
          done
          ln -s "$PWD/old-trusted/node_modules" .cache/full-timing-table-guarded/tools/node_modules
          node --version > .cache/full-timing-table-guarded/evidence/node-version.txt
          old-trusted/node_modules/.bin/playwright --version > .cache/full-timing-table-guarded/evidence/playwright-version.txt
      - name: Measure all six guarded cells with cold and same-profile reload
        timeout-minutes: 190
        run: |
          set -o pipefail
          node .cache/full-timing-table-guarded/tools/run.mjs \
            --old-trusted-root "$PWD/old-trusted" --candidate-trusted-root "$PWD/candidate-trusted" \
            --profiles-root "$PWD/.cache/full-timing-table-guarded/profiles" \
            --admission "$PWD/.cache/full-timing-table-guarded/evidence/admission.json" \
            --output "$PWD/.cache/full-timing-table-guarded/evidence" --repetitions 3 \
            2>&1 | tee .cache/full-timing-table-guarded/evidence/run.log
      - name: Preserve raw and partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-six-cell-guarded-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: .cache/full-timing-table-guarded/evidence/
