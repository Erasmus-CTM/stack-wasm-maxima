# SPDX-License-Identifier: AGPL-3.0-or-later
name: Reproduce the Binaryen spill-pointers value-stack gap
'on':
  workflow_dispatch:
  push:
    branches: [claude/peaceful-cray-p1sz3o]
    paths:
      - .github/workflows/spill-pointers.yml
      - runtime/diagnostics/spill-pointers/**
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - {version: 4.0.10, commit: 62a853cd3b3134398ce85cde8bb5cbb2ef0194cb}
          - {version: 6.0.13, commit: 35659964bc2762fffec0d257997fb61475f765b7}
        gc:
          - {name: ecl-bundled-8.2.8, repository: 'https://gitlab.com/mgerbershagen/ecl.git', commit: e4bdb2e5b1e444e1773032a53650773848f4d6cd, path: src/bdwgc}
          - {name: bdwgc-8.2.12, repository: 'https://github.com/ivmai/bdwgc.git', commit: 4fab5386df64466b2b61fc7209bef033cad1e6cc, path: .}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record the runner hardware and system
        run: |
          uname -srm
          grep PRETTY_NAME /etc/os-release
          lscpu | grep -E '^(Architecture|CPU\(s\)|Model name)'
          free -h | head -n 2
      - name: Install the pinned Emscripten SDK
        run: |
          git clone --quiet https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout --quiet "${{ matrix.sdk.commit }}"
          "$RUNNER_TEMP/emsdk/emsdk" install "${{ matrix.sdk.version }}"
          "$RUNNER_TEMP/emsdk/emsdk" activate "${{ matrix.sdk.version }}"
      - name: Fetch the pinned collector source
        run: |
          git clone --quiet --filter=blob:none --no-checkout "${{ matrix.gc.repository }}" "$RUNNER_TEMP/gc"
          git -C "$RUNNER_TEMP/gc" checkout --quiet "${{ matrix.gc.commit }}"
          test -f "$RUNNER_TEMP/gc/${{ matrix.gc.path }}/extra/gc.c"
      - name: Build and run every case
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh" > /dev/null
          emcc --version | head -n 1
          wasm-opt --version
          node --version
          python3 runtime/diagnostics/spill-pointers/run.py --emsdk "$RUNNER_TEMP/emsdk" \
            --gc "$RUNNER_TEMP/gc/${{ matrix.gc.path }}" --output "$RUNNER_TEMP/out"
      - name: Retain the report and disassembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spill-pointers-${{ matrix.sdk.version }}-${{ matrix.gc.name }}
          path: |
            ${{ runner.temp }}/out/report.json
            ${{ runner.temp }}/out/O2-spill-names.wat
          if-no-files-found: warn
  wasm-opt:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        binaryen:
          - {name: sdk-4.0.10, sdk: 4.0.10, commit: 62a853cd3b3134398ce85cde8bb5cbb2ef0194cb}
          - {name: sdk-6.0.13, sdk: 6.0.13, commit: 35659964bc2762fffec0d257997fb61475f765b7}
          - {name: main-f1f3a483, source: f1f3a483efe97639d3412a0565a2c3278a706e78}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record the runner hardware and system
        run: |
          uname -srm
          grep PRETTY_NAME /etc/os-release
          lscpu | grep -E '^(Architecture|CPU\(s\)|Model name)'
          free -h | head -n 2
      - name: Install wasm-opt from the pinned Emscripten SDK
        if: matrix.binaryen.sdk
        run: |
          git clone --quiet https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout --quiet "${{ matrix.binaryen.commit }}"
          "$RUNNER_TEMP/emsdk/emsdk" install "${{ matrix.binaryen.sdk }}"
          echo "WASM_OPT=$RUNNER_TEMP/emsdk/upstream/bin/wasm-opt" >> "$GITHUB_ENV"
      - name: Build wasm-opt from Binaryen source
        if: matrix.binaryen.source
        run: |
          git clone --quiet --filter=blob:none https://github.com/WebAssembly/binaryen.git "$RUNNER_TEMP/binaryen"
          git -C "$RUNNER_TEMP/binaryen" checkout --quiet "${{ matrix.binaryen.source }}"
          cmake -S "$RUNNER_TEMP/binaryen" -B "$RUNNER_TEMP/binaryen/build" -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_FUZZTEST=OFF > /dev/null
          make -C "$RUNNER_TEMP/binaryen/build" -j"$(nproc)" wasm-opt > /dev/null
          echo "WASM_OPT=$RUNNER_TEMP/binaryen/build/bin/wasm-opt" >> "$GITHUB_ENV"
      - name: Run the testcase
        run: |
          python3 runtime/diagnostics/spill-pointers/wasm-opt/check.py --wasm-opt "$WASM_OPT" \
            --output "$RUNNER_TEMP/out"
          for kind in plain flatten; do echo "== $kind.wat"; cat "$RUNNER_TEMP/out/$kind.wat"; done
      - name: Retain the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-opt-${{ matrix.binaryen.name }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
