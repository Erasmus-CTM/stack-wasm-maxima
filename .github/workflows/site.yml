name: Test and publish the tracked Quarto reviewer page

on:
  push:
    branches: [main, 'research/**']
    paths:
      - '.github/workflows/site.yml'
      - 'site/**'
      - 'prototype/**'
      - 'scripts/milestone-two/**'
      - 'scripts/milestone-three/**'
      - 'scripts/public-demo/isolation*.js'
      - 'scripts/site/**'
      - 'demos/manifest.json'
      - 'measurements/*runtime*.json'
      - 'reports/milestone-one/browser-3338304.json'
      - 'package*.json'
  pull_request:
    paths:
      - '.github/workflows/site.yml'
      - 'site/**'
      - 'prototype/**'
      - 'scripts/milestone-two/**'
      - 'scripts/milestone-three/**'
      - 'scripts/public-demo/isolation*.js'
      - 'scripts/site/**'
      - 'demos/manifest.json'
      - 'measurements/*runtime*.json'
      - 'reports/milestone-one/browser-3338304.json'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-maxima-reviewer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
      - name: Install the pinned authoring dependencies
        run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/stack-sympy
          ref: 1b1d50f69fc1e7eb39846b497657d72be325f597
          path: .site-sources/stack-sympy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: c366f175aba6b62caa628bc60f57bb1167fc087b
          path: .site-sources/ctm-checkers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: 94687f718fd651fc2857bc5242a64e45c8fd4697
          path: .site-sources/ctm-libs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .site-sources/stack
          sparse-checkout: |
            stack/maxima
            stack/cas
            stack/maximaparser
            corsscripts
            lang/en
            samplequestions/stacklibrary/Doc-Examples/Specialist-Tools-Docs/JSXgraphs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jsxgraph/jsxgraph-quarto
          ref: ba2daa52fa6b1c65b37322bca3f02643e31a688e
          path: .site-sources/jsxgraph-quarto
          persist-credentials: false
      - name: Install the pinned browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Stage pinned dependencies around the tracked QMD
        run: |
          python scripts/milestone-two/materialize.py --prepare-existing site \
            --stack-sympy-source .site-sources/stack-sympy \
            --ctm-checkers-source .site-sources/ctm-checkers \
            --ctm-libs-source .site-sources/ctm-libs
          python scripts/milestone-two/prepare-runtime.py --output site \
            --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers
          node scripts/milestone-two/test-frontend-pools.mjs site/_extensions/stack-sympy/stack-sympy.js
          python scripts/milestone-three/stage-parser.py --stack-source .site-sources/stack --output site/native
          python scripts/milestone-three/stage-feedback.py --stack-source .site-sources/stack --output site/native
          node prototype/native/test-feedback.mjs site/native
          python scripts/milestone-three/compile.py --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers --output site/native/questions.json \
            --resources site/maxima/native-questions
      - name: Prepare native variants in the actual Wasm backend
        env:
          CTM_COMPONENT_DEV: '1'
          STACK_SYMPY_PYTHON: python
          CTM_CHECKERS_SOURCE: .site-sources/ctm-checkers
          STACK_SOURCE: .site-sources/stack
          PYTHONPATH: .site-sources/ctm-checkers/src
        run: |
          python scripts/milestone-three/test-build.py
          python scripts/milestone-three/test-reference.py
          node prototype/jsxgraph/test-adapter.mjs
          node scripts/milestone-three/test-package-boards.mjs
          node scripts/milestone-three/build-site.mjs --site site --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers --jsxgraph-source .site-sources/jsxgraph-quarto
      - name: Render the committed Quarto page
        env:
          CTM_COMPONENT_DEV: '1'
          STACK_SYMPY_PYTHON: python
        run: |
          export CTM_LIBS_EXTENSION="$PWD/site/_extensions/ctm-libs"
          export CTM_CHECKERS_EXTENSION="$PWD/site/_extensions/ctm-checkers"
          quarto render site
          test -s site/_site/licenses.html && test "$(ls site/_site/LICENSES | wc -l)" -eq "$(ls site/LICENSES | wc -l)"
      - name: Exercise both backends in the rendered comparison page
        run: node scripts/site/smoke.mjs site/_site test-results/reviewer-site
      - name: Exercise native questions, graphical inputs and Python continuations
        run: node scripts/milestone-three/browser.mjs site/_site test-results/milestone-three
      - name: Install the independent native Maxima reference
        if: ${{ !cancelled() && hashFiles('test-results/milestone-three/browser.json') != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends maxima maxima-share
      - name: Compare captured native programs with the independent native runtime
        if: ${{ !cancelled() && hashFiles('test-results/milestone-three/browser.json') != '' }}
        run: |
          python scripts/milestone-three/native-reference.py --browser-report test-results/milestone-three/browser.json \
            --stack-source .site-sources/stack --output test-results/milestone-three/native-reference
      - name: Upload the rendered Quarto site for review
        if: ${{ !cancelled() && hashFiles('site/_site/maxima/native.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-site-${{ github.sha }}
          path: site/_site/
          if-no-files-found: error
      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-evidence-${{ github.sha }}
          path: test-results/reviewer-site/
          if-no-files-found: warn
      - name: Upload native preparation and browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-reviewer-evidence-${{ github.sha }}
          path: |
            .cache/native-build/
            site/native/build-manifest.json
            test-results/milestone-three/
          if-no-files-found: warn

  publish:
    needs: site
    if: github.event_name == 'push' && needs.site.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
    concurrency:
      group: stack-maxima-pages
      cancel-in-progress: false
    steps:
      - name: Check branch source under publication lock
        id: head
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const {data} = await github.rest.git.getRef({
              ...context.repo, ref: `heads/${branch}`
            });
            let current = data.object.sha === context.sha;
            if (!current) {
              const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${context.sha}...${data.object.sha}`
              });
              // The milestone suite may archive reports during this build.
              current = comparison.status === 'ahead' && comparison.files.length > 0 &&
                comparison.files.length < 300 && comparison.files.every(file =>
                  file.filename.startsWith('reports/milestone-two/') &&
                  (!file.previous_filename || file.previous_filename.startsWith('reports/milestone-two/')));
            }
            core.setOutput('current', String(current));
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.current == 'true'
        with:
          name: reviewer-site-${{ github.sha }}
          path: reviewer-site
      - name: Publish only the tested Quarto output
        if: steps.head.outputs.current == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reviewer-site
          publish_branch: gh-pages
          destination_dir: ${{ github.ref == 'refs/heads/main' && '.' || format('previews/{0}', github.ref_name) }}
          keep_files: true
      - name: Request deployment of the published Pages branch
        id: pages
        if: steps.head.outputs.current == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: pages} = await github.rest.repos.getPages({owner, repo});
            if (pages.build_type !== 'legacy' || pages.source?.branch !== 'gh-pages') {
              throw new Error('Expected the activated gh-pages branch publishing source.');
            }
            const {data: published} = await github.rest.git.getRef({owner, repo, ref: 'heads/gh-pages'});
            await github.rest.repos.requestPagesBuild({owner, repo});
            let built = false;
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data: build} = await github.rest.repos.getLatestPagesBuild({owner, repo});
              if (build.commit === published.object.sha && build.status === 'built') { built = true; break; }
              if (build.commit === published.object.sha && build.status === 'errored') throw new Error(build.error?.message || 'Pages build failed');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!built) throw new Error('Pages deployment did not finish in five minutes.');
            const suffix = context.ref === 'refs/heads/main' ? '' : `previews/${context.ref.replace(/^refs\/heads\//, '')}/`;
            const base = `${pages.html_url.replace(/\/$/, '')}/${suffix}`;
            core.setOutput('base', base);
            core.summary.addLink('Backend comparison page', `${base}maxima/examples.html`);
            await core.summary.write();
      - uses: actions/checkout@v4
        if: steps.head.outputs.current == 'true'
        with:
          persist-credentials: false
          path: verifier-source
      - uses: actions/setup-node@v4
        if: steps.head.outputs.current == 'true'
        with:
          node-version: '22'
      - name: Verify the deployed page with the same browser checks
        if: steps.head.outputs.current == 'true'
        env:
          REVIEWER_URL: ${{ steps.pages.outputs.base }}
        working-directory: verifier-source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const paths = new Set(['maxima/examples.html','maxima/native.html','native/build-manifest.json',
            'native/backend-worker.js','native/engine.js','native/input.js','native/input-rules.json',
            'native/stack-parser.js','native/feedback.js','native/feedback-messages.json',
            'native/python-bridge.js','native/python_bridge.py','runtime/maxima-session.js',
            'runtime/maxima-child.js','backend/worker.js','backend/native_adapter.py',
            'stack-sources.json','runtime-assets.json','jsxgraph/host.js','jsxgraph/frame.js']);
          for (const page of ['maxima/examples.html','maxima/native.html']) {
            const html = await readFile('../reviewer-site/' + page, 'utf8');
            for (const match of html.matchAll(/<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["']/gi)) {
              const url = new URL(match[1].replace(/&amp;/g,'&'), 'https://artifact.invalid/' + page);
              if (url.origin === 'https://artifact.invalid') paths.add(url.pathname.slice(1));
            }
          }
          const expected = await Promise.all([...paths].map(async path => ({path,
            sha256:hash(await readFile('../reviewer-site/' + path))})));
          let current = false;
          for (let attempt = 0; attempt < 36; attempt++) {
            const checks = await Promise.allSettled(expected.map(async file => {
              const response = await fetch(new URL(file.path, process.env.REVIEWER_URL), {cache:'no-store'});
              return response.ok && hash(new Uint8Array(await response.arrayBuffer())) === file.sha256;
            }));
            if (checks.every(result => result.status === 'fulfilled' && result.value)) { current = true; break; }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!current) throw new Error('The public pages and execution assets do not match the tested artifact.');
          JS
          node scripts/site/smoke.mjs ../reviewer-site ../test-results/public-reviewer-site
          NATIVE_PAGE_URL="${REVIEWER_URL}maxima/native.html" node scripts/milestone-three/browser.mjs \
            ../reviewer-site ../test-results/public-native-site
      - name: Upload public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-reviewer-evidence-${{ github.sha }}
          path: |
            test-results/public-reviewer-site/
            test-results/public-native-site/
          if-no-files-found: warn
