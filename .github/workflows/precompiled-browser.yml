# SPDX-License-Identifier: AGPL-3.0-or-later
name: Diagnose frozen precompiled browser inputs
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-precompiled-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser-diagnostic:
    # Manual evidence collection only: immutable inputs expire and cannot clear
    # the fresh full probe or become an automatic pull-request gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
      - name: Check the actual generated measurement worker
        run: |
          python runtime/precompiled/test-frozen-inputs.py
          node runtime/precompiled/test-measure-worker.mjs
      - name: Verify frozen run identities and archives before safe extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: python runtime/precompiled/frozen-inputs.py
      - uses: actions/checkout@v7
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .cache/precompiled-browser/upstream-stack
          sparse-checkout: stack/maxima
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: c366f175aba6b62caa628bc60f57bb1167fc087b
          path: .cache/precompiled-browser/ctm-checkers
          persist-credentials: false
      - name: Install pinned packaging and browser dependencies
        run: |
          python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Stage the accepted baseline and explicitly older compiled entry
        run: |
          python scripts/milestone-two/prepare-runtime.py --output .cache/precompiled-browser/site \
            --runtime-source .cache/precompiled-frozen-inputs/baseline/.cache/runtime-build/artifact \
            --stack-source .cache/precompiled-browser/upstream-stack \
            --ctm-checkers-source .cache/precompiled-browser/ctm-checkers
          python runtime/precompiled/stage-frozen-probe.py
      - name: Collect original and marked-copy reset isolation evidence
        env:
          PRECOMPILED_SITE: .cache/precompiled-browser/site
          PRECOMPILED_REPORT: test-results/precompiled-browser/measure.json
          PRECOMPILED_DIAGNOSTIC_PROVENANCE: .cache/precompiled-frozen-inputs/pair.json
        run: node runtime/precompiled/diagnose-reset.mjs
      - name: Preserve diagnostic reports and frozen identities even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frozen-precompiled-browser-${{ github.sha }}
          include-hidden-files: true
          path: |
            test-results/precompiled-browser/
            .cache/precompiled-frozen-inputs/provenance.json
            .cache/precompiled-frozen-inputs/pair.json
            .cache/precompiled-browser/site/stack-sources*.json
            .cache/precompiled-browser/site/precompiled-measure-worker.js
            .cache/precompiled-browser/site/reset-isolation-worker.js
            .cache/precompiled-browser/site/runtime/
          if-no-files-found: warn
