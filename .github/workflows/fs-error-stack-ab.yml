name: Diagnostic filesystem error stack A/B without rebuilding
'on':
  push:
    branches: [profiling/e8ad-fs-error-stack]
    paths:
      - .github/workflows/fs-error-stack-ab.yml
      - runtime/profiling/fs-error-stack/**
permissions:
  contents: read
  actions: read
concurrency:
  group: fs-error-stack-ab-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
jobs:
  compare:
    if: github.repository == 'Erasmus-CTM/stack-wasm-maxima' && github.event_name == 'push' && github.ref == 'refs/heads/profiling/e8ad-fs-error-stack'
    runs-on: ubuntu-24.04
    # 24 measurements x300s =120min worst case; leave setup/admission/upload time.
    timeout-minutes: 180
    steps:
      - name: Check out the exact accepted producer recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e8ad3d5b8b2ef2327537cd8e7ee50aaf0a8f8d31
          path: trusted
          persist-credentials: false
      - name: Check out the reviewed diagnostic experiment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: benchmark
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Admit original bytes and derive explicitly labelled diagnostic copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmark/runtime/profiling/fs-error-stack/prepare.py \
            --trusted-root "$PWD/trusted" --benchmark-root "$PWD/benchmark" \
            --work-root "$PWD/.cache/fs-error-stack"
      - name: Install the pinned browser harness
        run: |
          npm ci --prefix trusted --ignore-scripts --no-audit --no-fund
          trusted/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p .cache/fs-error-stack/tools
          for timing_tool in run.mjs clean-probe-worker.js derive-startup-observer.mjs startup-observer.jsfrag; do
            cp "benchmark/runtime/profiling/fs-error-stack/$timing_tool" .cache/fs-error-stack/tools/
          done
          ln -s "$PWD/trusted/node_modules" .cache/fs-error-stack/tools/node_modules
          node --version > .cache/fs-error-stack/evidence/node-version.txt
          trusted/node_modules/.bin/playwright --version > .cache/fs-error-stack/evidence/playwright-version.txt
      - name: Compare guarded original and derived source and matching FAS
        timeout-minutes: 130
        run: |
          set -o pipefail
          node .cache/fs-error-stack/tools/run.mjs \
            --trusted-root "$PWD/trusted" --arms-root "$PWD/.cache/fs-error-stack/arms" \
            --admission "$PWD/.cache/fs-error-stack/evidence/admission.json" \
            --output "$PWD/.cache/fs-error-stack/evidence" --repetitions 3 \
            2>&1 | tee .cache/fs-error-stack/evidence/run.log
      - name: Preserve complete and partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fs-error-stack-ab-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: .cache/fs-error-stack/evidence/
