# Publish only on the separate profiling branch after independent source review.
name: Baseline TRACE source and FAS pilot without CPU sampling
'on':
  push:
    branches: [profiling/e8ad-baseline-trace-no-cpu]
    paths:
      - .github/workflows/baseline-trace-no-cpu-pilot.yml
      - runtime/profiling/baseline-trace-no-cpu/**
permissions:
  contents: read
  actions: read
concurrency:
  group: e8ad-baseline-trace-no-cpu-${{ github.ref }}
  cancel-in-progress: false
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
jobs:
  profile:
    if: github.repository == 'Erasmus-CTM/stack-wasm-maxima' && github.event_name == 'push' && github.ref == 'refs/heads/profiling/e8ad-baseline-trace-no-cpu'
    runs-on: ubuntu-24.04
    # Two fresh instrumented trials x300s, plus full two-artifact admission/setup.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: trusted
    steps:
      - name: Check out the exact accepted runtime recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e8ad3d5b8b2ef2327537cd8e7ee50aaf0a8f8d31
          path: trusted
          persist-credentials: false
      - name: Check out this separately reviewed profiling harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: profiling
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify accepted archives and stage exact original runtime bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ../profiling/runtime/profiling/baseline-trace-no-cpu/prepare.py \
            --trusted-root "$PWD" --profiling-root "$GITHUB_WORKSPACE/profiling" \
            --work-root "$PWD/.cache/baseline-trace-no-cpu"
      - name: Install pinned Chromium harness dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium
          mkdir -p .cache/baseline-trace-no-cpu/tools
          for profile_tool in run.mjs stage.mjs cdp-profile.mjs child-hooks.js load-hooks.lisp probe-worker.js derive-startup-observer.mjs startup-observer.jsfrag; do
            cp "../profiling/runtime/profiling/baseline-trace-no-cpu/$profile_tool" .cache/baseline-trace-no-cpu/tools/
          done
          node --version > .cache/baseline-trace-no-cpu/evidence/node-version.txt
          ./node_modules/.bin/playwright --version > .cache/baseline-trace-no-cpu/evidence/playwright-version.txt
          node --input-type=module <<'JS'
          import os from 'node:os';
          import {writeFileSync} from 'node:fs';
          const cpus=os.cpus();
          writeFileSync('.cache/baseline-trace-no-cpu/evidence/runner-hardware.json',JSON.stringify({
            schema:1,observedBeforeMeasurement:true,platform:os.platform(),release:os.release(),arch:os.arch(),
            logicalCPUCount:cpus.length,cpuModels:[...new Set(cpus.map(cpu=>cpu.model))],
            availableParallelism:os.availableParallelism(),totalMemoryBytes:os.totalmem(),
            scope:'Untimed host metadata only; no CPU sampler/poller. Cross-run absolute timing comparisons remain unsupported.'
          },null,2)+'\n');
          JS
      - name: Run only the guarded baseline source and matching FAS TRACE pilot
        timeout-minutes: 20
        run: |
          set -o pipefail
          node .cache/baseline-trace-no-cpu/tools/run.mjs \
            --trusted-root "$PWD" --profiles-root "$PWD/.cache/baseline-trace-no-cpu/profiles" \
            --output "$PWD/.cache/baseline-trace-no-cpu/evidence" --baseline-trace-pilot \
            --admission "$PWD/.cache/baseline-trace-no-cpu/evidence/admission.json" \
            2>&1 | tee .cache/baseline-trace-no-cpu/evidence/profile-driver.log
      - name: Preserve complete and partial profiling evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-trace-no-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: trusted/.cache/baseline-trace-no-cpu/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
