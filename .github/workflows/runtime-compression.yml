name: Measure lossless runtime sidecars
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful pinned owned-runtime build run (empty requires a successful build of this exact head)
        required: false
        type: string
  pull_request:
    paths:
      - 'runtime/compression/**'
      - 'scripts/milestone-two/serve.mjs'
      - '.github/workflows/runtime-compression.yml'
permissions:
  contents: read
  actions: read
jobs:
  sidecars:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: .cache/runtime-compression/downloads
          key: compression-node22-${{ runner.os }}-${{ hashFiles('runtime/build/pins.json') }}
      - name: Verify and extract the exact SDK Node archive
        run: python runtime/compression/install-node.py
      - name: Check codec and HTTP contracts
        run: |
          node --version
          node runtime/compression/test-codec-server.mjs
          node runtime/compression/test-owned-recipe.mjs
          node runtime/compression/test-evidence.mjs
          node runtime/compression/test-select-source.cjs
      - name: Select a successful owned source-build artifact
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const {owner, repo} = context.repo;
            const workflow = (await github.rest.actions.getWorkflow({owner,repo,workflow_id:'runtime-build.yml'})).data;
            const {validateRun,selectArtifact} = require(process.cwd()+'/runtime/compression/select-source.cjs');
            const head=context.payload.pull_request?.head.sha||context.sha;
            const branch=context.payload.pull_request?.head.ref||context.ref.replace(/^refs\/heads\//,'');
            const expected={workflowID:workflow.id,head,branch,repository:owner+'/'+repo};
            const input = context.payload.inputs?.source_run_id;
            let run;
            if (input) {
              if (!/^[0-9]+$/.test(input)) throw new Error('Expected a numeric source run id');
              const runID=Number(input);
              if(!Number.isSafeInteger(runID))throw new Error('Unsafe source run id');
              run = (await github.rest.actions.getWorkflowRun({owner,repo,run_id:runID})).data;
              validateRun(run,expected);
            } else {
              const runs=await github.paginate(github.rest.actions.listWorkflowRuns,
                {owner,repo,workflow_id:workflow.id,head_sha:head,branch,status:'completed',per_page:100});
              run=runs.find(row=>{try{validateRun(row,expected);return true;}catch{return false;}});
            }
            if (!run) throw new Error('No successful current-head source build; build the whole workflow first.');
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
            const candidates=artifacts.filter(row=>/^owned-runtime-[0-9a-f]{40}$/.test(row.name)&&!row.expired);
            if(candidates.length!==1)throw new Error('Expected exactly one baseline source artifact');
            const artifact=selectArtifact(artifacts,candidates[0].name.slice('owned-runtime-'.length),run);
            const provenance={expected,run:{id:run.id,html_url:run.html_url,head_sha:run.head_sha,
              head_branch:run.head_branch,event:run.event,run_attempt:run.run_attempt,run_started_at:run.run_started_at,
              workflow_id:run.workflow_id,conclusion:run.conclusion},
              artifact:{id:artifact.id,name:artifact.name,digest:artifact.digest,size_in_bytes:artifact.size_in_bytes}};
            await fs.mkdir('.cache/runtime-compression',{recursive:true});
            await fs.writeFile('.cache/runtime-compression/source-run.json',JSON.stringify(provenance,null,2)+'\n');
            core.setOutput('run',String(run.id));core.setOutput('artifact',artifact.name);
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
          name: ${{ steps.source.outputs.artifact }}
          path: .cache/runtime-compression/source-run
      - name: Bind artifact recipe revision to the selected run head
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const {owner,repo}=context.repo;
            const path='.cache/runtime-compression/source-run.json';
            const provenance=JSON.parse(await fs.readFile(path,'utf8'));
            const raw=JSON.parse(await fs.readFile('.cache/runtime-compression/source-run/.cache/runtime-build/artifact/manifest.json','utf8'));
            if(!/^[0-9a-f]{40}$/.test(raw.recipe.revision))throw new Error('Missing exact source recipe revision');
            const commit=(await github.rest.repos.getCommit({owner,repo,ref:raw.recipe.revision})).data;
            const {validateRecipe}=require(process.cwd()+'/runtime/compression/select-source.cjs');
            const profiles=JSON.parse(await fs.readFile('runtime/build/compiler-profiles.json','utf8'));
            provenance.recipe=validateRecipe(raw,commit,provenance.run,provenance.artifact,profiles.profiles.baseline);
            await fs.writeFile(path,JSON.stringify(provenance,null,2)+'\n');
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
      - name: Install the pinned authoring dependencies
        run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
      - uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/stack-sympy
          ref: 1b1d50f69fc1e7eb39846b497657d72be325f597
          path: .site-sources/stack-sympy
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: c366f175aba6b62caa628bc60f57bb1167fc087b
          path: .site-sources/ctm-checkers
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: 94687f718fd651fc2857bc5242a64e45c8fd4697
          path: .site-sources/ctm-libs
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .site-sources/stack
          sparse-checkout: |
            stack/maxima
            stack/cas
            stack/maximaparser
            corsscripts
            lang/en
            samplequestions/stacklibrary/Doc-Examples/Specialist-Tools-Docs/JSXgraphs
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: jsxgraph/jsxgraph-quarto
          ref: ba2daa52fa6b1c65b37322bca3f02643e31a688e
          path: .site-sources/jsxgraph-quarto
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/ctm-assessment
          ref: 68fe838ca76ce7dfc4297f8ed4db1ccf1dc29a8b
          path: .site-sources/ctm-assessment
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: 2cdd3b47bb4722f65f168a0baf4dbd6a18bff384
          path: .site-sources/board-ctm-libs
          persist-credentials: false
      - name: Install the pinned browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Stage pinned dependencies around the tracked QMD
        run: |
          python scripts/milestone-two/materialize.py --prepare-existing site \
            --stack-sympy-source .site-sources/stack-sympy \
            --ctm-checkers-source .site-sources/ctm-checkers \
            --ctm-libs-source .site-sources/ctm-libs
          python scripts/milestone-two/prepare-runtime.py --output site --runtime-source .cache/runtime-compression/source-run/.cache/runtime-build/artifact \
            --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers
          node scripts/milestone-two/test-frontend-pools.mjs site/_extensions/stack-sympy/stack-sympy.js
          python scripts/milestone-three/stage-parser.py --stack-source .site-sources/stack --output site/native
          python scripts/milestone-three/stage-feedback.py --stack-source .site-sources/stack --output site/native
          node prototype/native/test-feedback.mjs site/native
          python scripts/milestone-three/compile.py --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers --output site/native/questions.json \
            --resources site/maxima/native-questions
      - name: Prepare native variants in the actual Wasm backend
        env:
          CTM_COMPONENT_DEV: '1'
          STACK_SYMPY_PYTHON: python
          CTM_CHECKERS_SOURCE: .site-sources/ctm-checkers
          STACK_SOURCE: .site-sources/stack
          PYTHONPATH: .site-sources/ctm-checkers/src
        run: |
          python scripts/milestone-three/test-build.py
          python scripts/milestone-three/test-reference.py
          node scripts/milestone-three/build-site.mjs --site site --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers --jsxgraph-source .site-sources/jsxgraph-quarto
      - name: Render the committed Quarto page
        env:
          CTM_COMPONENT_DEV: '1'
          STACK_SYMPY_PYTHON: python
        run: |
          export CTM_LIBS_EXTENSION="$PWD/site/_extensions/ctm-libs"
          export CTM_CHECKERS_EXTENSION="$PWD/site/_extensions/ctm-checkers"
          quarto render site
      - name: Package deterministic sidecars beside unchanged owned bytes
        run: |
          node runtime/compression/package.mjs \
            --source .cache/runtime-compression/source-run/.cache/runtime-build/artifact \
            --site site --output .cache/runtime-compression/artifact \
            --source-run-json .cache/runtime-compression/source-run.json
      - name: Exercise gzip sidecars and Brotli-safe delivery in the actual native page
        env:
          CTM_RUNTIME_COMPRESSION_SOURCE: .cache/runtime-compression/artifact
        run: |
          CTM_RUNTIME_COMPRESSION_MODE=gzip node scripts/milestone-three/browser.mjs site/_site test-results/runtime-compression/gzip
          CTM_RUNTIME_COMPRESSION_MODE=br node scripts/milestone-three/browser.mjs site/_site test-results/runtime-compression/br
      - name: Probe actual lazy-file headers and browser byte-range offsets
        run: node runtime/compression/probe-http.mjs
      - name: Install the independent desktop replay runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends maxima maxima-share
      - name: Replay all 316 programs for both delivery policies
        run: |
          python scripts/milestone-three/native-reference.py --browser-report test-results/runtime-compression/gzip/browser.json \
            --stack-source .site-sources/stack --output test-results/runtime-compression/gzip/reference
          python scripts/milestone-three/native-reference.py --browser-report test-results/runtime-compression/br/browser.json \
            --stack-source .site-sources/stack --output test-results/runtime-compression/br/reference
          node runtime/compression/check-evidence.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-compression-${{ github.sha }}
          include-hidden-files: true
          path: |
            .cache/runtime-compression/artifact/
            .cache/runtime-compression/node-provenance.json
            .cache/runtime-compression/source-run.json
            test-results/runtime-compression/
            .cache/native-build/
          if-no-files-found: warn
