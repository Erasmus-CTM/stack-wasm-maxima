# SPDX-License-Identifier: AGPL-3.0-or-later
name: Build and accept owned compiler profiles
on:
  workflow_dispatch:
    inputs:
      profiles:
        description: Optional explicit JSON profile list; empty runs the existing three-profile comparison
        type: string
        required: false
  # A runtime release (runtime-release.yml) builds and accepts one profile.
  workflow_call:
    inputs:
      profiles:
        description: JSON list of compiler profiles to build and accept
        type: string
        required: true
  pull_request:
    paths:
      - '.gitattributes'
      - 'runtime/build/**'
      - 'runtime/precompiled/**'
      - 'runtime/diagnostics/gc-root-regression.*'
      - '.github/workflows/precompiled-fixtures.yml'
      - '.github/workflows/runtime-build.yml'
      - '.github/workflows/runtime-release.yml'
      - 'scripts/milestone-two/prepare-runtime.py'
      - 'scripts/milestone-one/**'
      - 'scripts/milestone-three/build-site.mjs'
      - 'prototype/runtime/maxima-session.js'
      - 'prototype/runtime/maxima-child.js'
      - 'scripts/milestone-two/serve.mjs'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
  actions: read
concurrency:
  # Preserve each complete profile comparison. Distinct heads may run in parallel,
  # spending additional builds instead of cancelling earlier acceptance evidence.
  group: scoped-ecl-compiler-${{ inputs.profiles && 'release-' || '' }}${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profiles || '["baseline","ecl-oz","ecl-o2"]') }}
    env:
      CTM_COLD_BUILD: cold1
      CTM_ECL_COMPILER_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: b34bfc8af10cd80b6130baabe88a47c9a32c0333
          path: .cache/runtime-build/notices
          persist-credentials: false
      - name: Check owned-runtime manifest integrity
        run: |
          node scripts/milestone-one/test-fatal-reporting.mjs
          node runtime/build/test-runtime-source.mjs
          python runtime/build/test-substitution.py
          python runtime/build/test-toolchain.py
          python runtime/build/test-cold-evidence.py
          python runtime/build/test-compiler-evidence.py
          python runtime/build/test-timing-evidence.py
          python runtime/precompiled/test-stack-compiler-evidence.py
          python runtime/build/test-stack-acceptance.py
          python scripts/milestone-one/test-prepare.py
          python runtime/precompiled/test-bundle-provenance.py
          python runtime/precompiled/test-controller-parity.py
          node runtime/precompiled/test-probe-inputs.mjs
          node runtime/precompiled/test-entry-reads.mjs
          node runtime/precompiled/test-measure-worker.mjs
          python runtime/build/test-source-checkout.py
          python runtime/build/test-source-overlay.py
      - name: Record read-only upstream drift
        run: python runtime/build/check-upstream.py
      - name: Fetch exact source commits and verify their archive hashes
        run: |
          set -o pipefail
          mkdir -p .cache/runtime-build/logs
          python runtime/build/prepare-sources.py 2>&1 | tee .cache/runtime-build/logs/source-prepare.log
      - name: Install native and 32-bit build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib g++-multilib \
            libc6-dev-i386 autoconf automake libtool libltdl-dev texinfo bison flex gettext gawk pkg-config strace
          python runtime/precompiled/test-stack-compiler-evidence.py
      - name: Build without external gnuplot or restored compiler caches
        id: build
        run: bash runtime/build/build.sh
      - name: Package runtime, hashes, source archives, size table and licences
        run: python runtime/build/package.py --notices .cache/runtime-build/notices
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .cache/precompiled-stack/upstream-stack
          sparse-checkout: stack/maxima
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Require native assignment, reset and parser fixture controls'
        run: bash runtime/precompiled/native-fixtures.sh --reuse-built-native
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Translate pinned STACK and cross-compile for the browser target'
        run: bash runtime/precompiled/translate-and-cross-compile.sh "$PWD/.cache/precompiled-stack/upstream-stack"
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: maths/moodle-qtype_stack
          ref: 10d323311b7f39fb7b092dd10ce75f7d8632f525
          path: .cache/precompiled-stack-10d3233/upstream-stack
          sparse-checkout: stack/maxima
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Translate and cross-compile the older STACK pin independently'
        env:
          CTM_PRECOMPILED_STACK_PIN: 10d323311b7f39fb7b092dd10ce75f7d8632f525
        run: bash runtime/precompiled/translate-and-cross-compile.sh "$PWD/.cache/precompiled-stack-10d3233/upstream-stack"
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Require fresh full-library native validation parity at both pins'
        run: |
          python runtime/precompiled/full-entry-check.py --pin 33383047af39c204bf4442802a058f8b918b2b1b
          python runtime/precompiled/full-entry-check.py --pin 10d323311b7f39fb7b092dd10ce75f7d8632f525
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Replay packaged runtime and both successful FAS compiler proofs'
        run: |
          python runtime/build/verify-source-overlay.py .cache/runtime-build/artifact
          python runtime/precompiled/stack_compiler_evidence.py \
            --work .cache/precompiled-stack --pin 33383047af39c204bf4442802a058f8b918b2b1b \
            --runtime-artifact .cache/runtime-build/artifact
          python runtime/precompiled/stack_compiler_evidence.py \
            --work .cache/precompiled-stack-10d3233 --pin 10d323311b7f39fb7b092dd10ce75f7d8632f525 \
            --runtime-artifact .cache/runtime-build/artifact
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: c366f175aba6b62caa628bc60f57bb1167fc087b
          path: .cache/precompiled-stack/ctm-checkers
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Install pinned native packaging dependencies'
        run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Stage the unchanged source-loaded control and opt-in compiled manifest'
        run: |
          python scripts/milestone-two/prepare-runtime.py --output .cache/precompiled-stack/site \
            --runtime-source .cache/runtime-build/artifact \
            --stack-source .cache/precompiled-stack/upstream-stack \
            --ctm-checkers-source .cache/precompiled-stack/ctm-checkers
          python runtime/precompiled/stage-variant.py --site .cache/precompiled-stack/site \
            --stack-source .cache/precompiled-stack/upstream-stack \
            --bundle .cache/precompiled-stack/stackmaxima.fas \
            --translated .cache/precompiled-stack/source-initialized/stackmaxima.lisp
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Install pinned browser dependencies'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Measure startup and validate full session restart'
        env:
          PRECOMPILED_SITE: .cache/precompiled-stack/site
        run: node runtime/precompiled/measure.mjs
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: 1.8.27
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Install the pinned authoring dependencies'
        run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Erasmus-CTM/stack-sympy
          ref: 1b1d50f69fc1e7eb39846b497657d72be325f597
          path: .site-sources/stack-sympy
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: c366f175aba6b62caa628bc60f57bb1167fc087b
          path: .site-sources/ctm-checkers
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: 94687f718fd651fc2857bc5242a64e45c8fd4697
          path: .site-sources/ctm-libs
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .site-sources/stack
          sparse-checkout: |
            stack/maxima
            stack/cas
            stack/maximaparser
            corsscripts
            lang/en
            samplequestions/stacklibrary/Doc-Examples/Specialist-Tools-Docs/JSXgraphs
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: jsxgraph/jsxgraph-quarto
          ref: ba2daa52fa6b1c65b37322bca3f02643e31a688e
          path: .site-sources/jsxgraph-quarto
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Erasmus-CTM/ctm-assessment
          ref: 68fe838ca76ce7dfc4297f8ed4db1ccf1dc29a8b
          path: .site-sources/ctm-assessment
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: 2cdd3b47bb4722f65f168a0baf4dbd6a18bff384
          path: .site-sources/board-ctm-libs
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Stage pinned dependencies around the tracked QMD'
        run: |
          python scripts/milestone-two/materialize.py --prepare-existing site \
            --stack-sympy-source .site-sources/stack-sympy \
            --ctm-checkers-source .site-sources/ctm-checkers \
            --ctm-libs-source .site-sources/ctm-libs
          python scripts/milestone-two/prepare-runtime.py --output site --runtime-source .cache/runtime-build/artifact \
            --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers
          node scripts/milestone-two/test-frontend-pools.mjs site/_extensions/stack-sympy/stack-sympy.js
          python scripts/milestone-three/stage-parser.py --stack-source .site-sources/stack --output site/native
          python scripts/milestone-three/stage-feedback.py --stack-source .site-sources/stack --output site/native
          node prototype/native/test-feedback.mjs site/native
          python scripts/milestone-three/compile.py --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers --output site/native/questions.json \
            --resources site/maxima/native-questions
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Select the compiled entry before native-page preparation'
        run: |
          python runtime/precompiled/stage-variant.py --site site \
            --stack-source .site-sources/stack --bundle .cache/precompiled-stack/stackmaxima.fas \
            --translated .cache/precompiled-stack/source-initialized/stackmaxima.lisp
          cp site/stack-sources-precompiled.json site/stack-sources.json
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Prepare native variants in the actual Wasm backend'
        env:
          CTM_COMPONENT_DEV: '1'
          STACK_SYMPY_PYTHON: python
          CTM_CHECKERS_SOURCE: .site-sources/ctm-checkers
          STACK_SOURCE: .site-sources/stack
          PYTHONPATH: .site-sources/ctm-checkers/src
        run: |
          python scripts/milestone-three/test-build.py
          python scripts/milestone-three/test-reference.py
          node scripts/milestone-three/build-site.mjs --site site --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers --jsxgraph-source .site-sources/jsxgraph-quarto
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Render the committed Quarto page'
        env:
          CTM_COMPONENT_DEV: '1'
          STACK_SYMPY_PYTHON: python
        run: |
          export CTM_LIBS_EXTENSION="$PWD/site/_extensions/ctm-libs"
          export CTM_CHECKERS_EXTENSION="$PWD/site/_extensions/ctm-checkers"
          quarto render site
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Exercise both backends in the rendered comparison page'
        run: node scripts/site/smoke.mjs site/_site test-results/reviewer-site
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Prove opaque board MathJax font and accessibility closure offline'
        run: |
          node scripts/milestone-three/test-board-mathjax.mjs --site site/_site --browser chromium
          node scripts/milestone-three/test-board-mathjax.mjs --site site/_site --browser firefox
          node scripts/milestone-three/test-board-mathjax.mjs --site site/_site --browser webkit
          node scripts/milestone-three/test-board-mathjax.mjs --site site/_site --browser chromium --static-host --cors-transport --output test-results/board-mathjax-static-chromium.json
          node scripts/milestone-three/test-board-mathjax.mjs --site site/_site --browser firefox --static-host --cors-transport --output test-results/board-mathjax-static-firefox.json
          node scripts/milestone-three/test-board-mathjax.mjs --site site/_site --browser webkit --static-host --cors-transport --output test-results/board-mathjax-static-webkit.json
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Exercise every graphical variant on desktop and mobile static hosting'
        run: |
          for browser in chromium firefox webkit; do
            for width in 1280 390; do
              node scripts/milestone-three/measure-board-weight.mjs --site site/_site --browser "$browser" \
                --functional-only --static-host --width "$width" \
                --output "test-results/milestone-three/board-functional-$browser-$width.json"
            done
          done
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Measure current board transfers across cold and same-profile warm loads'
        run: |
          node scripts/milestone-three/measure-board-weight.mjs --site site/_site --browser chromium \
            --static-host --width 1280 \
            --output test-results/milestone-three/board-transfer-chromium.json
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Exercise native questions, graphical inputs and Python continuations'
        run: node scripts/milestone-three/browser.mjs site/_site test-results/milestone-three
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Replay compiled-controller programs under frequent garbage collection'
        run: |
          node scripts/milestone-three/gc-stress.mjs --site site/_site \
            --browser-report test-results/milestone-three/browser.json --output test-results/milestone-three/gc-stress.json
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Install the independent native Maxima reference'
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' && !cancelled() && hashFiles('test-results/milestone-three/browser.json') != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends maxima maxima-share
      - name: 'STACK acceptance: Compare captured native programs with the independent native runtime'
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' && !cancelled() && hashFiles('test-results/milestone-three/browser.json') != '' }}
        run: |
          python scripts/milestone-three/native-reference.py --browser-report test-results/milestone-three/browser.json \
            --stack-source .site-sources/stack --output test-results/milestone-three/native-reference
      - name: 'STACK acceptance: Replay the same 316 programs with the same-source native ECL build'
        env:
          MAXIMA_PREFIX: ${{ github.workspace }}/.cache/runtime-build/sources/maxima/wasm/maxima-ecl-combined
        run: |
          python scripts/milestone-three/native-reference.py --browser-report test-results/milestone-three/browser.json \
            --stack-source .site-sources/stack --output test-results/milestone-three/same-source-reference \
            --maxima "$MAXIMA_PREFIX/bin/maxima"
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Keep domain errors invalid and fail internal validation faults in both native Maxima builds'
        run: |
          # MAXIMA_PREFIX relocates any Maxima launcher; set it only for the same-source build.
          python scripts/milestone-three/test-validation-boundary.py --stack-source .site-sources/stack \
            --output test-results/milestone-three/validation-boundary-independent.json
          prefix="$GITHUB_WORKSPACE/.cache/runtime-build/sources/maxima/wasm/maxima-ecl-combined"
          MAXIMA_PREFIX="$prefix" python scripts/milestone-three/test-validation-boundary.py --stack-source .site-sources/stack \
            --maxima "$prefix/bin/maxima" --output test-results/milestone-three/validation-boundary-same-source.json
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Require complete compiled controller evidence and replay bindings'
        run: |
          python runtime/precompiled/check-controller-parity.py --site site/_site \
            --prepared .cache/native-build/prepared.json --browser test-results/milestone-three/browser.json \
            --independent test-results/milestone-three/native-reference/native-reference.json \
            --same-source test-results/milestone-three/same-source-reference/native-reference.json \
            --output test-results/precompiled-stack/controller-parity.json
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: 9e042dc5e57a1636be64ca5d08910c9af5ff1371
          path: .ctm-checkers-source
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: maths/moodle-qtype_stack
          ref: 10d323311b7f39fb7b092dd10ce75f7d8632f525
          path: .stack-upstream/10d323311b7f39fb7b092dd10ce75f7d8632f525
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .stack-upstream/33383047af39c204bf4442802a058f8b918b2b1b
          persist-credentials: false
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Prepare the unchanged official probes and their independent native controls'
        run: python scripts/milestone-one/prepare.py
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Require source-loaded official probes at both pins'
        env:
          CTM_MAXIMA_RUNTIME_SOURCE: .cache/runtime-build/artifact
          MILESTONE_ONE_REPORT_ROOT: .cache/precompiled-stack/probes-source-report
        run: |
          node scripts/milestone-one/run.mjs
          python scripts/milestone-one/compare.py
          mkdir -p test-results/precompiled-stack/probes-source
          cp test-results/milestone-one/* test-results/precompiled-stack/probes-source/
          cp .cache/precompiled-stack/probes-source-report/latest.json test-results/precompiled-stack/probes-source/comparison.json
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Stage two separately bound compiled official-probe bundles'
        run: |
          python runtime/precompiled/prepare-probes.py --prepared test-results/milestone-one/prepared.json \
            --output .cache/precompiled-probes
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: 'STACK acceptance: Require compiled official probes at both exact pins'
        env:
          CTM_MAXIMA_RUNTIME_SOURCE: .cache/runtime-build/artifact
          CTM_PRECOMPILED_PROBE_INDEX: .cache/precompiled-probes/index.json
          MILESTONE_ONE_REPORT_ROOT: .cache/precompiled-stack/probes-compiled-report
        run: |
          node scripts/milestone-one/run.mjs
          python scripts/milestone-one/compare.py
          mkdir -p test-results/precompiled-stack/probes-compiled
          cp test-results/milestone-one/* test-results/precompiled-stack/probes-compiled/
          cp .cache/precompiled-stack/probes-compiled-report/latest.json test-results/precompiled-stack/probes-compiled/comparison.json
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: Preserve compiled evidence and restore the source-loaded default for acceptance
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
        run: |
          mv test-results/milestone-three test-results/precompiled-stack/controller
          cp .cache/native-build/prepared.json test-results/precompiled-stack/controller/prepared.json
          cp site/_site/stack-sources.json test-results/precompiled-stack/controller/stack-sources.json
          cp site/_site/native/build-manifest.json test-results/precompiled-stack/controller/build-manifest.json
          # The opt-in compiled controller above is isolated from the release default.
          rm -rf site .cache/native-build
          git restore --source=HEAD -- site
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
      - name: Install the pinned authoring dependencies
        run: python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/stack-sympy
          ref: 1b1d50f69fc1e7eb39846b497657d72be325f597
          path: .site-sources/stack-sympy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: c366f175aba6b62caa628bc60f57bb1167fc087b
          path: .site-sources/ctm-checkers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: 94687f718fd651fc2857bc5242a64e45c8fd4697
          path: .site-sources/ctm-libs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .site-sources/stack
          sparse-checkout: |
            stack/maxima
            stack/cas
            stack/maximaparser
            corsscripts
            lang/en
            samplequestions/stacklibrary/Doc-Examples/Specialist-Tools-Docs/JSXgraphs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jsxgraph/jsxgraph-quarto
          ref: ba2daa52fa6b1c65b37322bca3f02643e31a688e
          path: .site-sources/jsxgraph-quarto
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-assessment
          ref: 68fe838ca76ce7dfc4297f8ed4db1ccf1dc29a8b
          path: .site-sources/ctm-assessment
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-libs
          ref: 2cdd3b47bb4722f65f168a0baf4dbd6a18bff384
          path: .site-sources/board-ctm-libs
          persist-credentials: false
      - name: Install the pinned browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Stage pinned dependencies around the tracked QMD
        run: |
          python scripts/milestone-two/materialize.py --prepare-existing site \
            --stack-sympy-source .site-sources/stack-sympy \
            --ctm-checkers-source .site-sources/ctm-checkers \
            --ctm-libs-source .site-sources/ctm-libs
          python scripts/milestone-two/prepare-runtime.py --output site --runtime-source .cache/runtime-build/artifact \
            --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers
          node scripts/milestone-two/test-frontend-pools.mjs site/_extensions/stack-sympy/stack-sympy.js
          python scripts/milestone-three/stage-parser.py --stack-source .site-sources/stack --output site/native
          python scripts/milestone-three/stage-feedback.py --stack-source .site-sources/stack --output site/native
          node prototype/native/test-feedback.mjs site/native
          python scripts/milestone-three/compile.py --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers --output site/native/questions.json \
            --resources site/maxima/native-questions
      - name: Prepare native variants in the actual Wasm backend
        env:
          CTM_COMPONENT_DEV: '1'
          STACK_SYMPY_PYTHON: python
          CTM_CHECKERS_SOURCE: .site-sources/ctm-checkers
          STACK_SOURCE: .site-sources/stack
          PYTHONPATH: .site-sources/ctm-checkers/src
        run: |
          python scripts/milestone-three/test-build.py
          python scripts/milestone-three/test-reference.py
          node scripts/milestone-three/build-site.mjs --site site --stack-source .site-sources/stack \
            --ctm-checkers-source .site-sources/ctm-checkers --jsxgraph-source .site-sources/jsxgraph-quarto
      - name: Render the committed Quarto page
        env:
          CTM_COMPONENT_DEV: '1'
          STACK_SYMPY_PYTHON: python
        run: |
          export CTM_LIBS_EXTENSION="$PWD/site/_extensions/ctm-libs"
          export CTM_CHECKERS_EXTENSION="$PWD/site/_extensions/ctm-checkers"
          quarto render site
      - name: Exercise both backends in the rendered comparison page
        run: node scripts/site/smoke.mjs site/_site test-results/reviewer-site
      - name: Exercise native questions, graphical inputs and Python continuations
        run: node scripts/milestone-three/browser.mjs site/_site test-results/milestone-three
      - name: 'STACK acceptance: Replay source-loaded programs under frequent garbage collection'
        run: |
          node scripts/milestone-three/gc-stress.mjs --site site/_site \
            --browser-report test-results/milestone-three/browser.json --output test-results/milestone-three/gc-stress.json
        if: ${{ matrix.profile == 'ecl-oz-maxima-oz' }}
      - name: Install the independent native Maxima reference
        if: ${{ !cancelled() && hashFiles('test-results/milestone-three/browser.json') != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends maxima maxima-share
      - name: Compare captured native programs with the independent native runtime
        if: ${{ !cancelled() && hashFiles('test-results/milestone-three/browser.json') != '' }}
        run: |
          python scripts/milestone-three/native-reference.py --browser-report test-results/milestone-three/browser.json \
            --stack-source .site-sources/stack --output test-results/milestone-three/native-reference
      - name: Replay the same 316 programs with the same-source native ECL build
        env:
          MAXIMA_PREFIX: ${{ github.workspace }}/.cache/runtime-build/sources/maxima/wasm/maxima-ecl-combined
        run: |
          python scripts/milestone-three/native-reference.py --browser-report test-results/milestone-three/browser.json \
            --stack-source .site-sources/stack --output test-results/milestone-three/same-source-reference \
            --maxima "$MAXIMA_PREFIX/bin/maxima"
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: 9e042dc5e57a1636be64ca5d08910c9af5ff1371
          path: .ctm-checkers-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          ref: 10d323311b7f39fb7b092dd10ce75f7d8632f525
          path: .stack-upstream/10d323311b7f39fb7b092dd10ce75f7d8632f525
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .stack-upstream/33383047af39c204bf4442802a058f8b918b2b1b
          persist-credentials: false
      - name: Compare both runtime builds at both STACK pins
        run: bash runtime/build/validate-probes.sh
      - name: Stage the deployed baseline beside the owned runtime for timings
        run: |
          python scripts/milestone-two/prepare-runtime.py --output .cache/runtime-build/deployed-demo \
            --stack-source .site-sources/stack --ctm-checkers-source .site-sources/ctm-checkers

      - name: Prove an authored plot question receives a build diagnostic
        env:
          CTM_COMPONENT_DEV: '1'
          STACK_SYMPY_PYTHON: python
          PYTHONPATH: .site-sources/ctm-checkers/src
        run: python runtime/build/test-plot-build.py
      - name: Download the frozen fully validated owned baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '39870918765'
          artifact-ids: '12467529817'
          merge-multiple: true
          path: .cache/runtime-build/baseline-run
      - name: Verify and stage the historical comparator, then measure cold and warm-profile reloads
        run: |
          python runtime/build/verify-baseline.py
          python scripts/milestone-two/prepare-runtime.py --output .cache/runtime-build/owned-baseline-demo \
            --runtime-source .cache/runtime-build/baseline-run/.cache/runtime-build/artifact --verified-baseline-comparator \
            --stack-source .site-sources/stack --ctm-checkers-source .site-sources/ctm-checkers
          node runtime/build/measure.mjs
          node runtime/build/measure-pages.mjs
      - name: Assert complete acceptance evidence
        run: python runtime/build/check-acceptance.py
      - name: Preserve build evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile == 'baseline' && format('owned-runtime-{0}', github.sha) || format('owned-runtime-{0}-{1}', matrix.profile, github.sha) }}
          include-hidden-files: true
          path: |
            .cache/precompiled-stack/logs/
            .cache/precompiled-stack/source-initialized/
            .cache/precompiled-stack/source-adapted/
            .cache/precompiled-stack/*.lisp
            .cache/precompiled-stack/stackmaxima.fas
            .cache/precompiled-stack/stackmaxima.fas.json
            .cache/precompiled-stack-10d3233/logs/
            .cache/precompiled-stack-10d3233/source-initialized/
            .cache/precompiled-stack-10d3233/source-adapted/
            .cache/precompiled-stack-10d3233/*.lisp
            .cache/precompiled-stack-10d3233/stackmaxima.fas
            .cache/precompiled-stack-10d3233/stackmaxima.fas.json
            .cache/precompiled-probes/
            .cache/precompiled-fixtures/
            test-results/precompiled-stack/
            test-results/board-mathjax*.json
            .cache/runtime-build/artifact/
            .cache/runtime-build/logs/
            .cache/runtime-build/source-manifest.json
            .cache/runtime-build/source-progress.json
            .cache/runtime-build/source-archives/
            .cache/runtime-build/build-recipes/
            .cache/runtime-build/sources/ecl/build/config.log
            .cache/runtime-build/sources/**/config.log
            .cache/runtime-build/validation/
            .cache/runtime-build/plot-diagnostic/
            test-results/milestone-three/
            test-results/milestone-one/
            test-results/runtime-upstream/
            .cache/native-build/
            site/native/build-manifest.json
          if-no-files-found: warn

  compare-compiler-trials:
    # Only when all three profiles were built (not for a single-profile release).
    if: ${{ !inputs.profiles }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: owned-runtime-${{ github.sha }}
          path: .cache/compiler-trials/baseline
      - uses: actions/download-artifact@v4
        with:
          name: owned-runtime-ecl-oz-${{ github.sha }}
          path: .cache/compiler-trials/ecl-oz
      - uses: actions/download-artifact@v4
        with:
          name: owned-runtime-ecl-o2-${{ github.sha }}
          path: .cache/compiler-trials/ecl-o2
      - name: Verify every accepted trial before common-runner timing
        run: python runtime/build/verify-compiler-trials.py
      - uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          ref: 33383047af39c204bf4442802a058f8b918b2b1b
          path: .site-sources/stack
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Erasmus-CTM/ctm-checkers
          ref: c366f175aba6b62caa628bc60f57bb1167fc087b
          path: .site-sources/ctm-checkers
          persist-credentials: false
      - name: Install the same browser harness
        run: |
          python -m pip install sympy==1.13.3 'networkx>=3.4' 'PyYAML>=6'
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Stage accepted trials without changing their runtime bytes
        run: |
          for profile in baseline ecl-oz ecl-o2; do
            python scripts/milestone-two/prepare-runtime.py --stack-source .site-sources/stack --ctm-checkers-source .site-sources/ctm-checkers --runtime-source ".cache/compiler-trials/$profile/.cache/runtime-build/artifact" --compiler-profile "$profile" --output ".cache/compiler-trials/demos/$profile"
          done
      - name: Compare the explicit baseline and ecl-oz controls on this same runner
        env:
          CTM_TIMING_REPETITIONS: '10'
          CTM_TIMING_PROFILES: baseline,ecl-oz
        run: node runtime/build/measure-compiler-trials.mjs
      # Plan D8: until a reference student laptop is named, the reference is this
      # runner with Node/server/browser processes limited together to a quarter
      # of one CPU. The quota caps aggregate CPU; the observed times are measured below.
      - name: Repeat under a CPU limit standing in for the reference laptop
        env:
          CTM_TIMING_REPETITIONS: '10'
          CTM_TIMING_PROFILES: baseline,ecl-oz
          CTM_TIMING_LABEL: cpu-quarter
          CTM_TIMING_CPU_LIMIT: systemd CPUQuota=25%
        run: |
          sudo -E systemd-run --scope --quiet -p CPUQuota=25% --uid="$(id -u)" --gid="$(id -g)" \
            -- "$(command -v node)" runtime/build/measure-compiler-trials.mjs
      - name: Report medians against the 20 s target (plan D8)
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs=require("fs"),dir=".cache/compiler-trials/comparison";
            const rows=[["full speed","timings.json"],["CPU quarter (D8 reference)","timings-cpu-quarter.json"]];
            const out=["## Startup medians (readiness, s)","","| Run | Profile | Cold | Warm-profile reload |","|---|---|---:|---:|"];
            let target=null;
            for(const [name,file] of rows){
              let r;try{r=JSON.parse(fs.readFileSync(dir+"/"+file))}catch{out.push(`| ${name} | (no report) | | |`);continue}
              if(!r.passed){out.push(`| ${name} | failed: ${String(r.failure).slice(0,80)} | | |`);continue}
              for(const [p,m] of Object.entries(r.medians))out.push(`| ${name} | ${p} | ${(m.cold/1000).toFixed(1)} | ${(m["warm-profile-reload"]/1000).toFixed(1)} |`);
              if(file.includes("cpu-quarter"))target=r.medians["ecl-oz"]?.cold;
            }
            out.push("",target==null?"D8: no reference measurement.":`D8: ecl-oz comparator cold start on the reference ${(target/1000).toFixed(1)} s against the 20 s target: ${target<=20000?"met":"not met"}.`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out.join("\n")+"\n");console.log(out.join("\n"));'
      - name: Preserve comparison and failed-trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-comparison-${{ github.sha }}
          path: .cache/compiler-trials/comparison/
          include-hidden-files: true
