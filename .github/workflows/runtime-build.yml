# SPDX-License-Identifier: AGPL-3.0-or-later
name: Build pinned Maxima ECL runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/build/**'
      - '.github/workflows/runtime-build.yml'
      - 'scripts/milestone-two/prepare-runtime.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: 5f78e2adf328a1b0f5f74fc993f0212198165e96
          path: .cache/runtime-build/notices
          persist-credentials: false
      - name: Fetch exact source commits and verify their archive hashes
        run: |
          set -o pipefail
          mkdir -p .cache/runtime-build/logs
          python runtime/build/prepare-sources.py 2>&1 | tee .cache/runtime-build/logs/source-prepare.log
      - name: Install native and 32-bit build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib g++-multilib \
            libc6-dev-i386 autoconf automake libtool libltdl-dev texinfo bison flex gettext gawk pkg-config
      - uses: actions/cache@v4
        with:
          path: .cache/runtime-build/sources/emsdk/downloads
          key: owned-emsdk-${{ runner.os }}-${{ hashFiles('runtime/build/pins.json') }}
      - uses: actions/cache@v4
        with:
          path: .cache/runtime-build/sources/maxima/wasm/ecl-host
          key: owned-host-ecl32-${{ runner.os }}-${{ hashFiles('runtime/build/pins.json', 'runtime/build/build.sh') }}
      - name: Build with upstream recipes
        run: bash runtime/build/build.sh
      - name: Package runtime, hashes, source archives, size table and licences
        run: python runtime/build/package.py --notices .cache/runtime-build/notices
      - name: Preserve build evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-runtime-${{ github.sha }}
          path: |
            .cache/runtime-build/artifact/
            .cache/runtime-build/logs/
            .cache/runtime-build/source-manifest.json
            .cache/runtime-build/source-progress.json
            .cache/runtime-build/source-archives/
            .cache/runtime-build/sources/ecl/build/config.log
          if-no-files-found: warn
